# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # pnpm lockfile, read by the npm ecosystem
    directory: "/" # Location of package manifests
    # Open PRs against development, the branch work integrates on.
    # main is the deploy branch and lags behind.
    target-branch: "development"
    schedule:
      interval: "weekly"
    # One PR per run for all patch and minor bumps.
    # Majors stay separate so they get reviewed on their own.
    groups:
      npm_and_yarn:
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
        patterns:
          - "*"
