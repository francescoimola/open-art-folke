title: Home

image:
  query: page.thumbnail.toFile
  back: black
  cover: true

tabs:
  content:
    label: Content
    icon: text
    fields:
      sections:
        type: multiselect
        label: Homepage sections
        help: Drag to reorder. Remove a section to hide it. The hero stays first; the photo banner and footer stay last. Hiding Programme breaks the nav's “Programme” link.
        default:
          - programme
          - countdown
          - intro
          - festival
          - sponsors
        options:
          programme: Programme
          countdown: Countdown
          intro: Intro
          festival: The Festival
          sponsors: Sponsors
      thumbnail:
        type: files
        label: Panel thumbnail
        help: Colourful image shown as this page's tile in the panel page list.
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image
      heroimage:
        type: files
        label: Hero background
        help: Background photo at the top of the page.
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image
      festivalimage:
        type: files
        label: Festival section photo
        help: Photo beside the “Open Art — The Festival” copy.
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image
      festivalbuttons:
        type: structure
        label: Festival section buttons
        help: Up to two. The first is solid red, the second is pale. Remove both to hide the buttons.
        max: 2
        default:
          - label: Explore the 2026 programme
            registration: false
            link: "#programme"
          - label: Register as an artist
            registration: true
        columns:
          label: true
          registration: true
        fields:
          label:
            type: text
            label: Button text
            required: true
          registration:
            type: toggle
            label: Registration button
            text:
              - Custom link
              - Uses registration status
            help: Links to the sign-up form when registration is open; otherwise opens the registration notice popover.
          link:
            type: link
            label: Goes to
            options:
              - page
              - url
              - anchor
            required: true
            when:
              registration: false
      bannerimage:
        type: files
        label: Photo banner background
        help: Background photo behind the closing banner (before footer)
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image

  # The homepage countdown section: counts down to the festival, then swaps to a "you've just missed it" message.
  countdown:
    label: Countdown
    icon: clock
    fields:
      countdownmode:
        type: toggles
        label: Countdown section shows
        default: auto
        grow: true
        options:
          - value: auto
            text: Automatic
          - value: countdown
            text: Countdown
          - value: over
            text: Festival's over message
        help: >
          Automatic shows the countdown until the festival end date, then the message from the next day (UK time).
          For the next edition, set the new dates below and pick Automatic or Countdown.

      countdownheadline:
        type: headline
        label: Countdown
      countdownstart:
        type: date
        label: Countdown start
        default: 2026-01-01
        width: 1/3
      countdownend:
        type: date
        label: Countdown end
        help: Opening day — the count reaches 0 here.
        default: 2026-10-09
        width: 1/3
      festivalend:
        type: date
        label: Festival end
        help: Last day of the festival.
        default: 2026-10-11
        width: 1/3
      countdownheading:
        type: text
        label: Heading ending
        placeholder: until Open Art Folke 2026
        help: Follows “There are X days”. A 🥳 is added automatically on 0 days.
      countdowntext:
        type: text
        label: Text
        placeholder: Almost there baby, almost there.
        width: 1/2
      countdownzerotext:
        type: text
        label: Text on 0 days (festival days)
        placeholder: Time to leave the house, dear
        width: 1/2
        help: Leave any of these blank to use the placeholder text.
      countdownimage:
        type: files
        label: Countdown image
        help: Image revealed as vertical slices in the countdown section.
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image

      overheadline:
        type: headline
        label: Festival's over message
      overheading:
        type: text
        label: Heading
        placeholder: You've just missed this year's festival
      overtext:
        type: textarea
        label: Text
        buttons: false
        placeholder: It was a blast and we're still recovering. Keep an eye here and on your socials to know what's coming next. In the meantime, godspeed my friend!
        help: Leave either blank to use the placeholder text. The countdown graphic is hidden while this shows.

  # The homepage #programme section (the nav's "Programme" link) has two versions; this tab picks one.
  # Both groups stay editable so the next version's copy can be prepared before switching.
  programme:
    label: Programme
    icon: book
    fields:
      programmemode:
        type: toggles
        label: Programme section shows
        default: signup
        grow: true
        options:
          - value: signup
            text: Sign-up (programme coming soon)
          - value: programme
            text: Read or download the programme
        help: >
          “Read or download” only appears once a PDF is uploaded below — until then the sign-up stays up.
          Switch back to sign-up after the festival.

      programmeheadline:
        type: headline
        label: Read or download the programme
      programmeheading:
        type: text
        label: Heading
        placeholder: See our 2026 programme
        help: Leave blank to use the placeholder text.
      programmetext:
        type: textarea
        label: Intro text
        buttons: false
        placeholder: It’s time to explore Open Art Folke. Flick through the programme, or download the PDF to keep on your device.
        help: Explains the two buttons. Leave blank to use the placeholder text.
      programmeheroimage:
        type: files
        label: Background illustration
        help: Decorative artwork behind the heading and text. Leave empty to show flat colour instead.
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image
      programmepdf:
        type: files
        label: Programme PDF
        help: >
          Powers both buttons. Visitors' downloads keep this file's name, so upload it as
          e.g. open-art-folke-2026-programme.pdf. Keep it under ~10 MB so it opens quickly on phones.
        max: 1
        query: page.files.template('pdf')
        uploads:
          template: pdf

      signupheadline:
        type: headline
        label: Sign-up (programme coming soon)
      signupheading:
        type: text
        label: Heading
        placeholder: Looking for the Festival Programme?
        width: 1/2
      signupsubheading:
        type: text
        label: Subheading (muted)
        placeholder: You’re early
        width: 1/2
      signuptext:
        type: textarea
        label: Intro text
        buttons: false
        placeholder: "We're still setting the stage for the 3rd edition of Open Art Folke: <i>Art This Way</i>, and we'll release the programme in the weeks leading up to the opening. Leave us your email and we'll tell you all about it* as soon as we can."
        help: Leave any of these blank to use the placeholder text.
      signupsuccess:
        type: text
        label: Message after signing up
        placeholder: Wooho! We'll send you an email as soon as the programme drops 😉
      signupfootnote:
        type: text
        label: Footnote
        placeholder: "*Spam? We want nothing to do with him either—and we'll never send you unsolicited communications."
      programmeimage:
        type: files
        label: Photo
        help: Photo beside the sign-up form.
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image

  seo:
    extends: tabs/seo
