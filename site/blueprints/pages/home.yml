title: Home

image:
  query: page.thumbnail.toFile
  back: black
  cover: true

tabs:
  content:
    label: Content
    icon: text
    fields:
      statementheadline:
        type: headline
        label: Statement
        help: The red opening band. On phones each part starts on its own line; on desktop they run on as one paragraph.
      statement_heading:
        type: text
        label: Opening sentence
        placeholder: Open Art Folke is a community of 200+ Folkestone artists.
      statement_body:
        type: textarea
        buttons: false
        label: Follow-on sentence
        placeholder: Every so often, we throw a mighty open-house style festival where we take you off the beaten track to see exactly where the art happens.
      statement_kicker:
        type: text
        label: Closing line
        placeholder: Come and have a nosey.
        help: Leave any of these blank to use the placeholder text.
      arrow_target:
        type: select
        label: Arrow goes to
        help: Where the ↓ arrow under the Statement jumps to (phones only). If that section is hidden, it goes to the first section instead. A new Custom section appears here once the page is saved.
        default: content
        empty: false
        # HomePage::arrowTargets(): First section, the placeholders, then each Custom section (by block id).
        options:
          type: query
          query: page.arrowTargets
      heroimage:
        type: files
        label: Opening photo
        help: Full-width photo under the Statement. It loads first, so keep it right-sized (about 2000px wide, JPEG).
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image
      # Homepage sections (ADR-0007): one block per section, rendered by site/snippets/blocks/<type>.php.
      # HomePage::homeSections() caps each type (SECTION_LIMITS) and falls back to Programme → About → Sponsors when empty.
      sectionblocks:
        type: blocks
        label: Homepage sections
        help: >
          The sections between the opening and closing photos, top to bottom. Drag to reorder; use a block's
          menu to hide it (or delete it) to take that section off the homepage. Programme, About and Sponsors
          show once each, even if you add them twice. Add up to two Custom sections for anything else (heading,
          text, links, photo); a third one doesn't show. While this list is empty, the homepage shows Programme,
          About and Sponsors. Hiding Programme also hides the “Festival programme” links in the menu and footer.
        empty: Showing Programme, About and Sponsors (the default). Add blocks to change the order.
        fieldsets:
          - programme
          - about
          - sponsors
          - custom
      bannerimage:
        type: files
        label: Closing photo
        help: Full-width photo at the end of the page, just before the footer.
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image
      thumbnail:
        type: files
        label: Panel thumbnail
        help: Colourful image shown as this page's tile in the panel page list.
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image

  # The homepage #programme section (the nav's "Festival programme" link).
  programme:
    label: Programme
    icon: book
    fields:
      programmeheading:
        type: text
        label: Heading
        placeholder: The 2026 festival programme
      programmetext:
        type: textarea
        label: Text
        buttons: false
        placeholder: Running 9-11 October, Open Art Folke 2026 brings together over 150 artists across 51 locations in and around Folkestone. Flick through the programme to see exactly what's going on, and where. Or download the PDF to keep on your device.
        help: Leave either blank to use the placeholder text. After the festival, edit this copy or hide the Programme block.
      programmepdf:
        type: files
        label: Programme PDF
        help: >
          The “See programme” and “Download PDF” links appear only once a PDF is here. Visitors' downloads keep
          this file's name, so upload it as e.g. open-art-folke-2026-programme.pdf. Keep it under ~10 MB so it opens quickly on phones.
        max: 1
        query: page.files.template('pdf')
        uploads:
          template: pdf
      programme_see_label:
        type: text
        label: Read link
        placeholder: See programme
        width: 1/2
      programme_see_hint:
        type: text
        label: Read link hint
        placeholder: Opens in a new tab
        width: 1/2
      programme_download_label:
        type: text
        label: Download link
        placeholder: Download PDF
        width: 1/2
      programme_download_hint:
        type: text
        label: Download link hint
        placeholder: Save the programme on your device
        width: 1/2
        help: The file size is added automatically.
      programmeimage:
        type: files
        label: Photo
        help: Photo under the links, in the right-hand column on desktop.
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image

  # The homepage #about section.
  about:
    label: About
    icon: users
    fields:
      aboutheading:
        type: text
        label: Heading
        placeholder: About the festival
      abouttext:
        type: textarea
        label: Text
        buttons:
          - bold
          - italic
          - link
          - ul
        placeholder: Each year since 2024 we've put together a festival… (leave blank to use the designed copy)
        help: Leave blank to use the designed copy.
      about_archive_label:
        type: text
        label: Link to the Archive
        placeholder: Scroll through our archives
        width: 1/2
      about_people_label:
        type: text
        label: Link to the About page
        placeholder: See who is behind Open Art Folke
        width: 1/2
      festivalimage:
        type: files
        label: Photo
        help: Wide photo under the About section.
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image

  # The homepage #sponsors section. The sponsors themselves come from the Sponsor page.
  sponsors:
    label: Sponsors
    icon: heart
    fields:
      sponsorsinfo:
        type: info
        text: The sponsor cards are the current sponsors from the Sponsor page (those tagged with this year's festival). Edit them there.
      sponsorsheading:
        type: text
        label: Heading
        placeholder: Recent sponsors
        width: 1/2
      sponsors_all_label:
        type: text
        label: Link to the Sponsor page
        placeholder: See all our sponsors
        width: 1/2
        help: Leave either blank to use the placeholder text.

  # Pre-redesign fields: kept readable (read-only) until the post-switch-over clean-up removes them. Nothing reads them.
  retired:
    label: Retired
    icon: archive
    fields:
      retiredinfo:
        type: info
        theme: notice
        text: These settings belonged to the old homepage design and no longer change the site. They are kept here for reference and will be removed.
      sections:
        type: multiselect
        label: Homepage sections (old)
        disabled: true
        options:
          programme: Programme
          countdown: Countdown
          intro: Intro
          festival: The Festival
          sponsors: Sponsors
      programmetheme:
        extends: fields/section-theme
        label: Programme colour
        disabled: true
      countdowntheme:
        extends: fields/section-theme
        label: Countdown colour
        disabled: true
      introtheme:
        extends: fields/section-theme
        label: Intro colour
        disabled: true
      festivaltheme:
        extends: fields/section-theme
        label: The Festival colour
        disabled: true
      sponsorstheme:
        extends: fields/section-theme
        label: Sponsors colour
        disabled: true
      festivalbuttons:
        type: structure
        label: Festival section buttons
        disabled: true
        fields:
          label:
            type: text
            label: Button text
          registration:
            type: toggle
            label: Registration button
          link:
            type: link
            label: Goes to
      countdownmode:
        type: toggles
        label: Countdown section shows
        disabled: true
        options:
          - value: auto
            text: Automatic
          - value: countdown
            text: Countdown
          - value: over
            text: Festival's over message
      countdownstart:
        type: date
        label: Countdown start
        disabled: true
        width: 1/3
      countdownend:
        type: date
        label: Countdown end
        disabled: true
        width: 1/3
      festivalend:
        type: date
        label: Festival end
        disabled: true
        width: 1/3
      countdownheading:
        type: text
        label: Countdown heading ending
        disabled: true
      countdowntext:
        type: text
        label: Countdown text
        disabled: true
        width: 1/2
      countdownzerotext:
        type: text
        label: Countdown text on 0 days
        disabled: true
        width: 1/2
      countdownimage:
        type: files
        label: Countdown image
        disabled: true
        max: 1
      overheading:
        type: text
        label: Festival's over heading
        disabled: true
      overtext:
        type: textarea
        label: Festival's over text
        disabled: true
      programmemode:
        type: toggles
        label: Programme section shows
        disabled: true
        options:
          - value: signup
            text: Sign-up (programme coming soon)
          - value: programme
            text: Read or download the programme
      programmeheroimage:
        type: files
        label: Programme background illustration
        disabled: true
        max: 1
      signupheading:
        type: text
        label: Sign-up heading
        disabled: true
        width: 1/2
      signupsubheading:
        type: text
        label: Sign-up subheading
        disabled: true
        width: 1/2
      signuptext:
        type: textarea
        label: Sign-up intro text
        disabled: true
      signupsuccess:
        type: text
        label: Message after signing up
        disabled: true
      signupfootnote:
        type: text
        label: Sign-up footnote
        disabled: true

  seo:
    extends: tabs/seo
