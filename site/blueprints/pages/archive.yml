title: Archive

image:
  query: page.thumbnail.toFile
  back: black
  cover: true

tabs:
  content:
    label: Content
    icon: text
    fields:
      thumbnail:
        type: files
        label: Panel thumbnail
        help: Colourful image shown as this page's tile in the panel page list.
        max: 1
        query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
        uploads:
          parent: site.find('media')
          template: image
      headline:
        type: text
        label: Intro heading
      intro:
        type: textarea
        label: Intro text
        help: Leave an empty line to separate a paragraph from the next.
        buttons:
          - bold
          - italic
          - link
      editions:
        type: structure
        label: Past editions
        help: One row per festival edition (most recent first). 
        fields:
          year:
            type: number
            label: Year
            required: true
            min: 2024
            max: 2100
            step: 1
            help: The festival year, e.g. 2025. It makes the Year link at the top of the page and the edition's web address (#edition-2025).
          headline:
            type: text
            label: Headline
          text:
            type: textarea
            label: Text
            help: Leave an empty line to separate a parahgraph from the next.
            buttons:
              - bold
              - italic
              - link
              - ul
          video:
            type: url
            label: Vimeo link (optional)
            help: >
              Paste the video's Vimeo share link, e.g.
              https://vimeo.com/123456789 (or .../123456789/abcdef for an
              unlisted video). Vimeo handles the poster and playback — no upload
              needed. Leave empty for no video.
          gallery:
            type: files
            label: Photos
            help: Up to 12. Leave empty for none.
            max: 12
            query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
            uploads:
              parent: site.find('media')
              template: image
  seo:
    extends: tabs/seo
