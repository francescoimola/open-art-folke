title: Site

tabs:
  pages:
    label: Pages
    icon: dashboard
    columns:
      - width: 1/1
        sections:
          pages:
            type: pages
            label: Pages

  media:
    label: Media
    icon: image
    columns:
      - width: 1/1
        sections:
          library:
            type: pages
            headline: Media library
            templates: media
            status: all
            image: false
            info: "{{ page.images.count }} images, {{ page.videos.count }} videos"

  settings:
    label: Settings
    icon: cog
    columns:
      - width: 1/1
        sections:
          festival:
            type: fields
            label: Festival
            fields:
              festivalyear:
                type: number
                label: Current festival year
                help: Sponsors tagged with this year show under "Current" (with logo); all others show under "Previous".
                step: 1
                default: 2026
                width: 1/2
              festivalstart:
                type: date
                label: Festival start date
                help: First day of the festival. Used for the event details shown to Google (rich results).
                default: 2026-10-09
                width: 1/2
              festivalend:
                type: date
                label: Festival end date
                help: Last day of the festival. Used for the event details shown to Google.
                default: 2026-10-11
                width: 1/2
              festivalvenue:
                type: text
                label: Venue / area name
                help: e.g. "Across Folkestone". Shown as the event location name to search engines.
                default: Across Folkestone
                width: 1/2
              festivallocality:
                type: text
                label: Town / city
                help: e.g. "Folkestone".
                default: Folkestone
                width: 1/2
              festivalregion:
                type: text
                label: County / region
                help: e.g. "Kent".
                default: Kent
                width: 1/2
          menu:
            type: fields
            label: Site menu
            fields:
              menu:
                type: structure
                label: Site menu
                help: The links in the header, the mobile menu and the footer, in this order. Leave empty to use the default menu (Festival programme, About OA, Explore past editions, How to help). A link to the homepage’s “programme” section hides itself while Programme is hidden on the homepage. Register is added automatically while registration is open.
                fields:
                  label:
                    type: text
                    label: Label
                    required: true
                    help: What the link does, without arrows (e.g. “About OA”).
                    width: 1/2
                  link:
                    type: link
                    label: Link
                    required: true
                    options:
                      - page
                      - url
                    width: 1/2
                  anchor:
                    type: text
                    label: Section on that page (optional)
                    help: The id of a section to jump to, without the # (e.g. “programme”).
                    width: 1/2
              menu_start_label:
                type: text
                label: “Start here” label
                help: The extra home link at the front of the footer menu. Leave empty for “Start here”.
                placeholder: Start here
          registration:
            type: fields
            label: Registration
            fields:
              registration_status:
                type: select
                label: Registration status
                required: true
                empty: false
                default: closed
                options:
                  soon: Not open yet
                  open: "Open — accepting registrations"
                  closed: Closed
                help: Controls the Register links across the whole site (header, mobile menu and footer).
              register_url:
                type: url
                label: Register link URL
                help: Where the Register links go. Only used when the status is “Open”.
                width: 1/2
                when:
                  registration_status: open
              register_label:
                type: text
                label: Register link label
                help: Shown in the header, the mobile menu and the footer. Leave empty for “Register”.
                placeholder: Register
                width: 1/2
                when:
                  registration_status: open
              open_message:
                type: textarea
                label: Message (optional)
                buttons: false
                help: Shown in the footer’s “I’m an artist/creative” item, above the Register link.
                when:
                  registration_status: open
              soon_intro:
                type: info
                label: “Not open yet” text
                text: Shown in the footer’s “I’m an artist/creative” item while registration hasn’t opened.
                when:
                  registration_status: soon
              soon_message:
                type: textarea
                label: Message
                buttons: false
                default: "Registration for the next edition isn’t open yet — check back soon."
                when:
                  registration_status: soon
              soon_link_url:
                type: url
                label: Link URL (optional)
                width: 1/2
                when:
                  registration_status: soon
              soon_link_label:
                type: text
                label: Link label
                width: 1/2
                when:
                  registration_status: soon
              soon_footnote:
                type: text
                label: Footnote / deadline (optional)
                when:
                  registration_status: soon
              closed_intro:
                type: info
                label: “Closed” text
                text: Shown in the footer’s “I’m an artist/creative” item, to explain why registration is closed and what to do next/instead.
                when:
                  registration_status: closed
              closed_message:
                type: textarea
                label: Message
                buttons: false
                default: "Registration for the 2026 edition has now closed. However, you can still apply to exhibit at our sister event, held in partnership with Docker Brewery."
                when:
                  registration_status: closed
              closed_link_url:
                type: url
                label: Link URL (optional)
                width: 1/2
                default: "https://docs.google.com/forms/d/e/1FAIpQLSd3-EqopTb0SHhlLaztdyvEdbh6LS9BdY-0iEL3-t7YejJOeQ/viewform"
                when:
                  registration_status: closed
              closed_link_label:
                type: text
                label: Link label
                width: 1/2
                default: Apply to Docker's exhibition
                when:
                  registration_status: closed
              closed_footnote:
                type: text
                label: Footnote / deadline (optional)
                default: "Deadline: 19 July 2026"
                when:
                  registration_status: closed
          links:
            type: fields
            label: Links
            fields:
              donation_url:
                type: url
                label: Donation link
                help: Donation link. Leave blank to hide the button.
              instagram_url:
                type: url
                label: Instagram URL
                help: Link to Instagram page. Leave blank to hide it.
              facebook_url:
                type: url
                label: Facebook URL
                help: Link to Facebook page. Leave blank to hide it.
          contact:
            type: fields
            label: Contact
            fields:
              contact_email:
                type: email
                label: Contact email
                help: Copied by the “Copy email address” buttons and shown next to them. Leave empty for openartfolke@gmail.com.
                placeholder: openartfolke@gmail.com
                width: 1/2
              copy_email_label:
                type: text
                label: “Copy email” button label
                help: A verb plus an object, up to about 24 characters. Leave empty for “Copy email address”.
                placeholder: Copy email address
                width: 1/2
          credits:
            type: fields
            label: Credits
            fields:
              media_credits:
                type: textarea
                label: Media credits
                help: Credits text for the footer (videographers, photographers). Links and formatting are supported. Leave empty for the designed text.
          footer:
            type: fields
            label: Footer
            fields:
              footer_info_title:
                type: text
                label: Info heading
                placeholder: All you need to know
                help: Every footer field falls back to the designed text when left empty.
              footer_visitor_label:
                type: text
                label: Visitor label
                placeholder: I’m a visitor
                width: 1/2
              footer_visitor_link:
                type: text
                label: Visitor link label
                placeholder: See festival programme
                help: Links to the homepage programme; hidden while Programme is hidden on the homepage.
                width: 1/2
              footer_artist_label:
                type: text
                label: Artist label
                placeholder: I’m an artist/creative
                help: Its text follows the Registration status (see Registration above).
                width: 1/2
              footer_socials_label:
                type: text
                label: Socials label
                placeholder: Find us on socials
                help: Lists the Instagram and Facebook links above.
                width: 1/2
              footer_contact_label:
                type: text
                label: Contact label
                placeholder: Contact us
                help: Shows the Contact email with its copy button.
                width: 1/2
              media_credits_title:
                type: text
                label: Media credits heading
                placeholder: Media credits
                help: The text is in Credits above.
                width: 1/2
              privacy_title:
                type: text
                label: Privacy heading
                placeholder: Privacy
              privacy_text:
                type: textarea
                label: Privacy text
                placeholder: "By signing up for festival updates, you agree to us collecting your email address and sending you news about the festival, artists and sponsors. We may share data with service providers and keep it only as long as necessary. Unsubscribe using the link in any email, or contact us to access, correct or delete your data."
              fundraising_title:
                type: text
                label: Fundraising heading
                placeholder: Fundraising
              fundraising_text:
                type: textarea
                label: Fundraising text
                placeholder: "This website may include information about fundraising and ways to support the festival. Donation pages, links or supporter/sponsorship arrangements may have their own terms."
              terms_title:
                type: text
                label: Terms heading
                placeholder: Terms
              terms_text:
                type: textarea
                label: Terms text
                placeholder: "Open Art Folke is a volunteer-run, unincorporated charitable association. This website shares info about our festival, artists and supporters. We aim to keep it accurate and up to date, but can’t guarantee it is always complete or current. Festival dates, volunteer team, fees and other arrangements may change."
              copyright_title:
                type: text
                label: Copyright heading
                placeholder: Copyright © Open Art Folke, 2026
                help: Leave empty for “Copyright © Open Art Folke, ” and the current year.
              copyright_text:
                type: textarea
                label: Copyright text
                placeholder: "Site design, copywriting, and heartfelt support by Francesco Imola. Powered by the wonderful CMS that is Kirby, and hosted by Fortrabbit in the EU."
          seo:
            type: fields
            label: SEO / Social defaults
            fields:
              seodescription:
                type: textarea
                label: Default meta description
                buttons: false
                maxlength: 160
                help: Used for search results and social cards on any page without its own description.
              ogimage:
                type: files
                label: Default social share image
                help: Shown when a page is shared on social media and has no image of its own (ideally, keep uploads to 1200×630).
                max: 1
                query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
                uploads:
                  parent: site.find('media')
                  template: image
