title: Site

tabs:
  pages:
    label: Pages
    icon: dashboard
    columns:
      - width: 1/1
        sections:
          pages:
            type: pages
            label: Pages

  media:
    label: Media
    icon: image
    columns:
      - width: 1/1
        sections:
          library:
            type: pages
            headline: Media library
            templates: media
            status: all
            image: false
            info: "{{ page.images.count }} images, {{ page.videos.count }} videos"

  settings:
    label: Settings
    icon: cog
    columns:
      - width: 1/1
        sections:
          festival:
            type: fields
            label: Festival
            fields:
              festivalyear:
                type: number
                label: Current festival year
                help: Sponsors tagged with this year show under "Current" (with logo); all others show under "Previous".
                step: 1
                default: 2026
                width: 1/2
              festivalstart:
                type: date
                label: Festival start date
                help: First day of the festival. Used for the event details shown to Google (rich results).
                default: 2026-10-09
                width: 1/2
              festivalend:
                type: date
                label: Festival end date
                help: Last day of the festival. Used for the event details shown to Google.
                default: 2026-10-11
                width: 1/2
              festivalvenue:
                type: text
                label: Venue / area name
                help: e.g. "Across Folkestone". Shown as the event location name to search engines.
                default: Across Folkestone
                width: 1/2
              festivallocality:
                type: text
                label: Town / city
                help: e.g. "Folkestone".
                default: Folkestone
                width: 1/2
              festivalregion:
                type: text
                label: County / region
                help: e.g. "Kent".
                default: Kent
                width: 1/2
          registration:
            type: fields
            label: Registration
            fields:
              registration_status:
                type: select
                label: Registration status
                required: true
                empty: false
                default: closed
                options:
                  soon: Not open yet
                  open: "Open — accepting registrations"
                  closed: Closed
                help: Controls the Register buttons and popovers across the whole site.
              register_url:
                type: url
                label: Register link URL
                help: Where the Register buttons link to. Only used when the status is “Open”.
                when:
                  registration_status: open
              soon_intro:
                type: info
                label: “Not open yet” text
                text: Shown in the Register popover and footer while registration hasn’t opened.
                when:
                  registration_status: soon
              soon_message:
                type: textarea
                label: Message
                buttons: false
                default: "Registration for the next edition isn’t open yet — check back soon."
                when:
                  registration_status: soon
              soon_link_url:
                type: url
                label: Link URL (optional)
                width: 1/2
                when:
                  registration_status: soon
              soon_link_label:
                type: text
                label: Link label
                width: 1/2
                when:
                  registration_status: soon
              soon_footnote:
                type: text
                label: Footnote / deadline (optional)
                when:
                  registration_status: soon
              closed_intro:
                type: info
                label: “Closed” text
                text: Shown in the Register popover and footer once registration has closed.
                when:
                  registration_status: closed
              closed_message:
                type: textarea
                label: Message
                buttons: false
                default: "Registration for the 2026 edition has now closed. However, you can still apply to exhibit at our sister event, held in partnership with Docker Brewery."
                when:
                  registration_status: closed
              closed_link_url:
                type: url
                label: Link URL (optional)
                width: 1/2
                default: "https://docs.google.com/forms/d/e/1FAIpQLSd3-EqopTb0SHhlLaztdyvEdbh6LS9BdY-0iEL3-t7YejJOeQ/viewform"
                when:
                  registration_status: closed
              closed_link_label:
                type: text
                label: Link label
                width: 1/2
                default: Apply to Docker's exhibition
                when:
                  registration_status: closed
              closed_footnote:
                type: text
                label: Footnote / deadline (optional)
                default: "Deadline: 19 July 2026"
                when:
                  registration_status: closed
          links:
            type: fields
            label: Links
            fields:
              donation_url:
                type: url
                label: Donation link
                help: Donation link. Leave blank to hide the button.
              instagram_url:
                type: url
                label: Instagram URL
                help: Link to Instagram page. Leave blank to hide it.
              facebook_url:
                type: url
                label: Facebook URL
                help: Link to Facebook page. Leave blank to hide it.
          credits:
            type: fields
            label: Credits
            fields:
              media_credits:
                type: textarea
                label: Media credits
                help: Credits text for the footer (videographers, photographers). Links and formatting are supported.
          seo:
            type: fields
            label: SEO / Social defaults
            fields:
              seodescription:
                type: textarea
                label: Default meta description
                buttons: false
                maxlength: 160
                help: Used for search results and social cards on any page without its own description.
              ogimage:
                type: files
                label: Default social share image
                help: Shown when a page is shared on social media and has no image of its own (ideally, keep uploads to 1200×630).
                max: 1
                query: site.find('media').images.filterBy("extension", "in", ["jpg", "jpeg", "png", "webp"])
                uploads:
                  parent: site.find('media')
                  template: image
